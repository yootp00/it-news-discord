name: IT News to Discord

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub 사정에 따라 수 분씩 지연될 수 있음
  workflow_dispatch:       # Actions 탭에서 수동 실행
    inputs:
      test:
        description: "디스코드로 테스트 메시지 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04  # ubuntu-latest 는 2026-10 부터 Ubuntu 26 으로 전환 중
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # 이미 보낸 글 목록(state.json)은 main 이 아닌 state 브랜치에 커밋 1개로만 보관한다
      - name: Load state
        run: |
          if git fetch -q origin state:refs/remotes/origin/state; then
            git show origin/state:state.json > state.json
          fi

      - name: Fetch feeds and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 아래는 선택: 등록하면 그 종류만 해당 채널로, 없으면 DISCORD_WEBHOOK_URL 채널로
          DISCORD_WEBHOOK_OUTAGE: ${{ secrets.DISCORD_WEBHOOK_OUTAGE }}
          DISCORD_WEBHOOK_SECURITY: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}
          DISCORD_WEBHOOK_RELEASE: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
          DISCORD_WEBHOOK_AI: ${{ secrets.DISCORD_WEBHOOK_AI }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
        run: python3 news_bot.py ${{ inputs.test && '--test' || '' }}

      # 바뀌었을 때만, 부모 없는 커밋 하나로 state 브랜치를 덮어쓴다 (기록이 쌓이지 않음)
      - name: Save state
        if: ${{ !inputs.test }}
        run: |
          [ -f state.json ] || exit 0
          if git cat-file -e origin/state:state.json 2>/dev/null && \
             git show origin/state:state.json | cmp -s - state.json; then
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w state.json)
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "bot state")
          git push -f -q origin "$commit:refs/heads/state"
