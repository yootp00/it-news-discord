name: IT News to Discord

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub 사정에 따라 수 분씩 지연될 수 있음
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Fetch feeds and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_OUTAGE: ${{ secrets.DISCORD_WEBHOOK_OUTAGE }}
        run: python3 news_bot.py

      # 이미 보낸 글 목록(state.json)을 저장소에 커밋해 다음 실행에 이어 쓴다
      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
